<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-직장인 생존 동물 도감</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px 30px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        
        h1 { 
            font-size: 24px; 
            color: #1a237e; 
            margin-bottom: 15px; 
            word-break: keep-all; 
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            word-break: keep-all;
        }
        
        .btn {
            display: block; 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 12px;
            background-color: #3f51b5; 
            color: white; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: 15px;
        }
        .btn:hover:not(:disabled) { 
            background-color: #303f9f; 
            transform: translateY(-2px);
        }
        .btn:disabled { 
            background-color: #c5cae9; 
            cursor: not-allowed; 
        }
        .btn-outline { 
            background-color: transparent; 
            color: #3f51b5; 
            border: 2px solid #3f51b5; 
        }
        .btn-outline:hover { background-color: #f0f4ff; }
        .btn-share { background-color: #009688; }
        .btn-share:hover { background-color: #00796b; }

        #question-screen, #result-screen { display: none; }
        
        .progress-bar { 
            width: 100%; 
            background-color: #e0e0e0; 
            border-radius: 8px; 
            height: 10px; 
            margin-bottom: 30px; 
            overflow: hidden; 
        }
        .progress { 
            height: 100%; 
            background-color: #3f51b5; 
            width: 0%; 
            border-radius: 8px; 
            transition: width 0.4s ease; 
        }
        
        .question-title { 
            font-size: 20px; 
            line-height: 1.5; 
            font-weight: bold; 
            min-height: 80px; 
            margin-bottom: 25px; 
            word-break: keep-all; 
            color: #2c3e50;
        }
        .option-btn {
            display: block; 
            width: 100%; 
            padding: 18px 20px; 
            margin-bottom: 15px;
            background-color: #f8f9fa; 
            border: 2px solid #e9ecef; 
            border-radius: 12px;
            font-size: 15px; 
            color: #495057; 
            cursor: pointer; 
            transition: all 0.2s ease;
            text-align: left; 
            word-break: keep-all; 
            line-height: 1.4;
        }
        .option-btn:hover { 
            border-color: #c5cae9; 
            background-color: #f0f4ff; 
        }
        .option-btn.selected {
            background-color: #e8eaf6; 
            border-color: #3f51b5; 
            font-weight: bold; 
            color: #1a237e;
        }

        .result-card {
            background-color: #fff;
            border: 2px solid #f0f4ff;
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 25px;
        }
        
        .result-img-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background-color: #f8f9fa;
            border: 2px solid #e8eaf6;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: float 3s ease-in-out infinite;
        }
        .result-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .start-img-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #e0e0e0;
        }
        .start-img-grid img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            background-color: #f8f9fa;
            border: 1px solid #e0e0e0;
            object-fit: cover;
            animation: float 3s ease-in-out infinite;
        }
        .start-img-grid img:nth-child(even) { animation-delay: 1.5s; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .animal-title { font-size: 26px; color: #3f51b5; font-weight: 900; margin-bottom: 15px; }
        .mbti-type {
            display: inline-block;
            background-color: #e8eaf6;
            color: #3f51b5;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .desc-box { 
            background-color: #f8f9fa; 
            padding: 20px; 
            border-radius: 12px; 
            font-size: 15px; 
            line-height: 1.6; 
            text-align: left; 
            word-break: keep-all; 
            color: #495057;
        }
        
        #toast-msg {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: absolute;
            z-index: 1;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast-msg.show {
            visibility: visible;
            opacity: 1;
            bottom: 40px;
        }
    </style>
</head>
<body>

<div class="container" id="start-screen">
    <div style="font-size: 50px; margin-bottom: 20px;">🏢</div>
    <h1>오피스 생태계 적성검사</h1>
    <p>오피스 정글에서 살아남는 나의 생존 전략은?<br>총 16개의 질문을 통해 나의 직장인 부캐를 확인해 보세요!</p>
    <button class="btn" onclick="startTest()">시작하기</button>
    
    <div class="start-img-grid" id="start-grid">
        <!-- JS를 통해 16개의 이미지가 동적으로 채워집니다 -->
    </div>
</div>

<div class="container" id="question-screen">
    <div class="progress-bar"><div class="progress" id="progress"></div></div>
    <div class="question-title" id="question-title">질문 텍스트</div>
    
    <div id="options-container">
        <button class="option-btn" id="btn-A" onclick="selectOption('A')">A 옵션</button>
        <button class="option-btn" id="btn-B" onclick="selectOption('B')">B 옵션</button>
    </div>
    
    <button class="btn" id="next-btn" onclick="goToNext()" disabled>다음 질문</button>
</div>

<div class="container" id="result-screen">
    <div class="result-card">
        <div class="result-img-container">
            <img id="result-img" src="" alt="결과 동물" onerror="this.src='https://placehold.co/150x150/e8eaf6/3f51b5?text=Img'">
        </div>
        <div class="animal-title" id="result-animal">동물 이름</div>
        <div class="mbti-type" id="result-mbti">MBTI</div>
        
        <div class="desc-box" id="result-desc">
            설명 텍스트
        </div>
    </div>
    
    <button class="btn btn-share" onclick="copyUrl()">🔗 결과 공유하기 (링크 복사)</button>
    <button class="btn btn-outline" onclick="location.reload()">🔄 다시 하기</button>
    
    <div id="toast-msg">주소가 복사되었습니다!</div>
</div>

<script>
    const questions = [
        { q: "출근 후 사무실에 도착했을 때 나는?", A: { text: "동료들과 가벼운 스몰토크로 아침을 연다", type: "E" }, B: { text: "조용히 자리에 앉아 메일함부터 확인한다", type: "I" } },
        { q: "점심시간이 다가온다. 선호하는 점심 식사는?", A: { text: "다 같이 맛집으로! 시끌벅적한 식사", type: "E" }, B: { text: "혼자 혹은 마음 맞는 한두 명과 조용한 식사", type: "I" } },
        { q: "힘든 하루를 마치고 퇴근하는 길, 나의 스트레스 해소법은?", A: { text: "친구들을 만나거나 모임에 참석해 에너지를 채운다", type: "E" }, B: { text: "빨리 집에 가서 혼자만의 시간을 가지며 쉰다", type: "I" } },
        { q: "타 부서 사람들과 협업해야 하는 상황이 오면?", A: { text: "적극적으로 먼저 다가가 대화를 주도한다", type: "E" }, B: { text: "주어진 내 역할과 업무에 우선 집중한다", type: "I" } },
        
        { q: "새로운 프로젝트를 맡게 되었다. 먼저 확인하는 것은?", A: { text: "구체적인 예산, 일정, 과거 유사 사례 데이터", type: "S" }, B: { text: "이 프로젝트가 가져올 장기적인 비전과 새로운 아이디어", type: "N" } },
        { q: "업무 지시를 받을 때 선호하는 방식은?", A: { text: "A부터 Z까지 명확한 매뉴얼과 세부 지침이 있는 것", type: "S" }, B: { text: "목표만 주어지고 달성 방법은 내가 자유롭게 정하는 것", type: "N" } },
        { q: "동료가 업무 아이디어를 냈을 때 내 머릿속에 드는 생각은?", A: { text: "그게 현실적으로 구현이 가능할까? 비용은?", type: "S" }, B: { text: "재미있겠다! 거기에 이런 기능도 추가하면 어떨까?", type: "N" } },
        { q: "보고서를 작성할 때 더 중요하게 생각하는 것은?", A: { text: "정확한 팩트, 수치, 그리고 현실성", type: "S" }, B: { text: "전체적인 흐름, 스토리, 그리고 방향성", type: "N" } },

        { q: "동료가 '나 오늘 실수해서 혼났어...'라고 할 때 나의 반응은?", A: { text: "무슨 실수 했는데? 다음엔 이렇게 대처해 봐", type: "T" }, B: { text: "정말 속상했겠다. 커피 한잔할래?", type: "F" } },
        { q: "팀 내 의견 충돌이 발생했다. 해결하는 나의 기준은?", A: { text: "누구 말이 논리적으로 맞고 회사에 이익이 되는가", type: "T" }, B: { text: "팀원들의 기분이 상하지 않고 조화롭게 해결되는가", type: "F" } },
        { q: "인사 평가 시즌, 내가 더 받고 싶은 피드백은?", A: { text: "객관적인 성과 수치와 업무 능력에 대한 인정", type: "T" }, B: { text: "팀을 위해 헌신하고 노력한 태도에 대한 인정", type: "F" } },
        { q: "후배에게 업무 피드백을 주어야 할 때 나는?", A: { text: "개선점을 명확하고 객관적인 팩트 중심으로 말한다", type: "T" }, B: { text: "상대방이 상처받지 않게 긍정적인 말과 섞어 부드럽게 말한다", type: "F" } },

        { q: "다음 주 금요일까지 중요한 보고서를 내야 한다.", A: { text: "오늘부터 요일별로 분량을 나눠서 계획적으로 작성한다", type: "J" }, B: { text: "머릿속으로 구상만 하다가 마감일이 다가올 때 몰아서 완성한다", type: "P" } },
        { q: "업무용 폴더나 바탕화면 정리는 어떻게 되어 있나?", A: { text: "날짜별, 프로젝트별로 깔끔하게 폴더링 되어 있다", type: "J" }, B: { text: "일단 다운로드 폴더나 바탕화면에 두고 나중에 찾는다", type: "P" } },
        { q: "갑작스러운 오후 회의 일정이 잡혔을 때 나는?", A: { text: "오늘 세워둔 계획이 틀어져서 약간 스트레스를 받는다", type: "J" }, B: { text: "그럴 수 있지. 회의 일정에 맞춰 유연하게 대처한다", type: "P" } },
        { q: "회의를 진행할 때 내가 선호하는 방식은?", A: { text: "사전에 안건을 문서화하고 명확한 결론을 도출하는 것", type: "J" }, B: { text: "자유로운 분위기에서 다양한 아이디어를 브레인스토밍하는 것", type: "P" } }
    ];

    function createAnimalIcon(emoji, colorStart, colorEnd) {
        // SVG를 활용해 그라데이션 배경과 이모지가 합성된 고화질 이미지를 즉석에서 렌더링합니다.
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
            <rect width="150" height="150" rx="35" fill="url(#grad-${emoji})"/>
            <defs>
                <linearGradient id="grad-${emoji}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:${colorStart};stop-opacity:1" />
                    <stop offset="100%" style="stop-color:${colorEnd};stop-opacity:1" />
                </linearGradient>
            </defs>
            <text x="50%" y="55%" font-size="80" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
        </svg>`;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    const results = {
        "ESTJ": { img: createAnimalIcon("🦏", "#ff9a9e", "#fecfef"), animal: "불도저 코뿔소", desc: "명확한 목표와 기한을 중시하며, 논리적이고 체계적인 의사결정으로 팀을 든든하게 이끕니다." },
        "ENTJ": { img: createAnimalIcon("🐈‍⬛", "#a18cd1", "#fbc2eb"), animal: "카리스마 흑표범", desc: "전체적인 비전을 제시하고 효율성을 극대화하여 조직의 목표 달성을 주도하는 타고난 리더입니다." },
        "ESFJ": { img: createAnimalIcon("🐕", "#fbc2eb", "#a6c1ee"), animal: "다정한 골든리트리버", desc: "뛰어난 공감 능력으로 팀의 분위기를 화기애애하게 만들며, 동료들을 살뜰히 챙기는 서포터입니다." },
        "ENFJ": { img: createAnimalIcon("🐧", "#84fab0", "#8fd3f4"), animal: "오지랖 넓은 펭귄", desc: "타인의 성장을 돕는 것을 즐기며, 부드러운 카리스마로 팀원들을 하나로 모으는 멘토 역할을 합니다." },
        "ESTP": { img: createAnimalIcon("🐆", "#fccb90", "#d57eeb"), animal: "날쌘돌이 치타", desc: "복잡한 문제도 빠르게 해결하는 임기응변의 달인으로, 실용적이고 행동력이 뛰어납니다." },
        "ENTP": { img: createAnimalIcon("🦜", "#e0c3fc", "#8ec5fc"), animal: "호기심 많은 앵무새", desc: "항상 새롭고 창의적인 아이디어를 제시하며, 자유로운 토론을 통해 혁신을 이끌어냅니다." },
        "ESFP": { img: createAnimalIcon("🦦", "#f093fb", "#f5576c"), animal: "파티광 쿼카", desc: "특유의 긍정 에너지로 사무실에 활력을 불어넣으며, 소통과 협력을 통해 시너지를 만듭니다." },
        "ENFP": { img: createAnimalIcon("🐬", "#4facfe", "#00f2fe"), animal: "통통 튀는 돌고래", desc: "풍부한 상상력과 열정으로 새로운 프로젝트에 활기를 더하며, 사람들에게 영감을 줍니다." },
        "ISTJ": { img: createAnimalIcon("🦫", "#43e97b", "#38f9d7"), animal: "꼼꼼한 비버", desc: "정해진 규칙과 매뉴얼을 철저히 준수하며, 어떤 업무든 책임감 있게 완수하는 원칙주의자입니다." },
        "INTJ": { img: createAnimalIcon("🦉", "#fa709a", "#fee140"), animal: "체스 두는 부엉이", desc: "독립적으로 깊이 사고하며, 장기적인 안목으로 최적의 전략을 수립하는 날카로운 분석가입니다." },
        "ISFJ": { img: createAnimalIcon("🦭", "#30cfd0", "#330867"), animal: "따뜻한 해달", desc: "묵묵히 자신의 역할을 다하며, 팀의 안정감과 평화를 지키는 든든하고 따뜻한 지원군입니다." },
        "INFJ": { img: createAnimalIcon("🐺", "#a8edea", "#fed6e3"), animal: "통찰력 있는 늑대", desc: "사물의 본질을 꿰뚫어 보는 직관력을 가졌으며, 의미 있는 가치를 추구하는 조용한 리더입니다." },
        "ISTP": { img: createAnimalIcon("🐈", "#5ee7df", "#b490ca"), animal: "만능 재주꾼 고양이", desc: "뛰어난 적응력으로 상황에 맞게 효율적인 해결책을 찾아내며, 실용적인 기술 감각이 돋보입니다." },
        "INTP": { img: createAnimalIcon("🦔", "#d299c2", "#fef9d7"), animal: "생각에 잠긴 고슴도치", desc: "논리와 데이터를 바탕으로 문제를 객관적으로 분석하며, 끊임없이 지적 탐구를 즐기는 브레인입니다." },
        "ISFP": { img: createAnimalIcon("🦥", "#fdfbfb", "#ebedee"), animal: "여유로운 나무늘보", desc: "갈등을 피하고 조화를 중시하며, 유연한 태도로 어떤 환경에서든 둥글게 적응해 나갑니다." },
        "INFP": { img: createAnimalIcon("🐿️", "#cd9cf2", "#f6f3ff"), animal: "공상하는 다람쥐", desc: "자신만의 확고한 가치관을 가지고 일하며, 세심하고 진정성 있는 태도로 묵묵히 헌신합니다." }
    };

    let currentQ = 0;
    let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    let selectedType = ""; 

    window.onload = function() {
        const grid = document.getElementById('start-grid');
        for (const key in results) {
            const img = document.createElement('img');
            img.src = results[key].img;
            img.alt = results[key].animal;
            grid.appendChild(img);
        }
    };

    function startTest() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('question-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('question-title').innerText = `Q${currentQ + 1}. ${q.q}`;
        document.getElementById('btn-A').innerText = q.A.text;
        document.getElementById('btn-B').innerText = q.B.text;
        
        document.getElementById('btn-A').classList.remove('selected');
        document.getElementById('btn-B').classList.remove('selected');
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.disabled = true;
        selectedType = "";

        if (currentQ === questions.length - 1) {
            nextBtn.innerText = "결과 보기";
        } else {
            nextBtn.innerText = "다음 질문";
        }

        const progressPercent = ((currentQ + 1) / questions.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;
    }

    function selectOption(choice) {
        document.getElementById('btn-A').classList.remove('selected');
        document.getElementById('btn-B').classList.remove('selected');
        
        document.getElementById(`btn-${choice}`).classList.add('selected');
        selectedType = questions[currentQ][choice].type;
        
        document.getElementById('next-btn').disabled = false;
    }

    function goToNext() {
        if (selectedType !== "") {
            scores[selectedType]++;
        }
        
        currentQ++;
        if (currentQ < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('question-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let mbti = "";
        mbti += (scores.E >= 2) ? "E" : "I";
        mbti += (scores.S >= 2) ? "S" : "N";
        mbti += (scores.T >= 2) ? "T" : "F";
        mbti += (scores.J >= 2) ? "J" : "P";

        const res = results[mbti];
        
        document.getElementById('result-img').src = res.img;
        document.getElementById('result-animal').innerText = res.animal;
        document.getElementById('result-mbti').innerText = mbti;
        document.getElementById('result-desc').innerText = res.desc;
    }

    // 공유하기 버튼에 사용될 고정 주소
    const SHARE_URL = "https://npngsoon2.github.io/mbti/";

    function copyUrl() {
        const url = SHARE_URL;
        
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(showToast);
        } else {
            const textArea = document.createElement("textarea");
            textArea.value = url;
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px";
            document.body.prepend(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (error) {
                console.error('URL 복사 실패', error);
            } finally {
                textArea.remove();
            }
        }
    }

    function showToast() {
        const toast = document.getElementById("toast-msg");
        toast.className = "show";
        setTimeout(function(){ 
            toast.className = toast.className.replace("show", ""); 
        }, 2500);
    }
</script>
</body>
</html>
